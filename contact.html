<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | KATEぷら</title>
<meta name="description" content="KATEぷらへのご質問・無料学習相談のお申し込みはこちら。山梨市駅前、KATEKYO学院 山梨市駅前校にて実施。">
<link rel="icon" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--shallow:#7ecbe0;--mid:#2d93b8;--deep:#0d4a66;--abyss:#082d3f;--foam:#eff8fb;--sun:#f3cf1f;--sun-deep:#caa600;--kelp:#6fae3a;--kelp-deep:#548623;--ink:#122733;--ink-soft:#4f6b78;--paper:#ffffff;--line:rgba(13,74,102,.14);}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--paper);line-height:1.9;-webkit-font-smoothing:antialiased}
.zen{font-family:'Zen Kaku Gothic New',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(20px,5vw,60px)}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(20px,5vw,60px);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:0 2px 16px rgba(13,74,102,.08);gap:20px;flex-wrap:wrap}
.nav__logo img{height:38px}
.nav__links{display:flex;gap:24px;font-size:.84rem;font-weight:700}
.nav__links a{color:var(--ink-soft);transition:color .2s}
.nav__links a:hover,.nav__links a.on{color:var(--mid)}
.nav__cta{background:var(--sun);color:var(--ink);font-weight:900;font-size:.8rem;padding:9px 18px;border-radius:999px;white-space:nowrap}
@media(max-width:780px){.nav__links{display:none}}
.pg-hero{background:linear-gradient(160deg,var(--deep),var(--abyss));color:#fff;padding:70px 0 54px;text-align:center}
.pg-hero .sec-kicker{display:inline-flex;align-items:center;gap:10px;color:var(--sun);font-weight:900;font-size:.78rem;letter-spacing:.22em;margin-bottom:16px;justify-content:center}
.pg-hero .sec-kicker::before{content:"";width:30px;height:1px;background:var(--sun)}
.pg-hero h1{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:clamp(1.6rem,4.2vw,2.4rem)}
.pg-hero p{color:rgba(255,255,255,.82);margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto}
main{padding:60px 0}
.contact-info{display:flex;gap:40px;margin-bottom:10px;flex-wrap:wrap}
.contact-info div b{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;color:var(--mid);font-size:.78rem;letter-spacing:.08em;margin-bottom:6px}
.contact-info div span{color:var(--ink-soft);font-size:.92rem}
.form-shell{background:var(--foam);border-radius:18px;overflow:hidden;margin-top:36px}
.form-shell iframe{width:100%;height:1200px;border:none;display:block}
@media(max-width:600px){.form-shell iframe{height:1300px}}
.footer{background:#06212f;color:rgba(255,255,255,.55);padding:36px 0;text-align:center;font-size:.8rem}
.footer img{height:30px;margin:0 auto 12px;filter:brightness(0) invert(1);opacity:.8}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo"><img src="assets/logo-wide.png" alt="KATEぷら"></a>
  <div class="nav__links">

    <a href="pricing.html">料金</a>
    <a href="faq.html">よくある質問</a>
  </div>
  <a href="contact.html" class="nav__cta">無料学習相談</a>
</nav>

<header class="pg-hero">
  <div class="wrap">
    <span class="sec-kicker">Contact</span>
    <h1 class="zen">無料学習相談・お問い合わせ</h1>
    <p>ご質問、無料学習相談のお申し込みはこちらのフォームからどうぞ。入会金のご案内もこちらで承ります。</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="contact-info">
      <div><b class="zen">教室</b><span>KATEKYO学院 山梨市駅前校（山梨県山梨市上神内川1706 廣瀬ビル1F）</span></div>
      <div><b class="zen">電話</b><span>0553-20-8008</span></div>
      <div><b class="zen">アクセス</b><span>山梨市駅から徒歩2分</span></div>
    </div>
    <div class="form-shell">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe1260PplNLNBY-toj-vJQ4QTdlzC9313KBa71L036RT121HQ/viewform?embedded=true" title="無料学習相談・お問い合わせフォーム">読み込んでいます…</iframe>
    </div>
  </div>
</main>

<footer class="footer">
  <img src="assets/logo-wide.png" alt="KATEぷら">
  © 2026 KATEぷら — kate-pl.com
</footer>

</body>
</html>
